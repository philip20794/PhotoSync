services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photosync}
      POSTGRES_USER: ${POSTGRES_USER:-photosync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  server:
    build: ./server
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-photosync}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}@db:5432/${POSTGRES_DB:-photosync}
      MEDIA_ROOT: /media/photosync
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ${PHOTOSYNC_MEDIA_PATH:?PHOTOSYNC_MEDIA_PATH setzen}
        target: /media/photosync
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
